name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  oracle-and-training:
    name: BCIR oracle + LLVM training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lowering toolchain (clang/lld/llvm for AOT/JIT/WASM tests; node for WASM)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nodejs

      - name: BCIR oracle (Python conformance tests)
        run: python3 -m bcir.tests.run_all

      - name: Freestanding C StreamPack runtime (no-libc + Python->C ABI parity)
        run: bash tools/c/check_runtime.sh

      - name: LLVM training examples and invalid-example tripwire
        run: |
          if command -v llvm-as >/dev/null && command -v opt >/dev/null; then
            bash llvm-training/tools/verify-examples.sh
          else
            echo "llvm-as and opt not both present; skipping llvm-training standalone example validation"
          fi

      - name: LLVM training example manifest drift
        run: bash llvm-training/tools/verify-manifest.sh

      - name: LLVM training binary-analysis CSV schemas
        run: llvm-training/tools/verify-csv-schema.sh

      - name: LLVM training invalid fixtures
        run: |
          if command -v llvm-as >/dev/null && command -v opt >/dev/null; then
            bash llvm-training/tools/verify-invalid-fixtures.sh
          else
            echo "llvm-as and opt not both present; skipping llvm-training invalid fixture validation"
          fi

      - name: LLVM training opt-diff golden fixtures
        run: |
          if command -v opt >/dev/null; then
            bash llvm-training/tools/verify-opt-diff.sh
          else
            echo "opt not present; skipping llvm-training opt-diff golden validation"
          fi

      - name: LLVM training opaque pointer syntax
        run: bash llvm-training/tools/verify-opaque-pointers.sh

      - name: LLVM training lit tests
        run: |
          if command -v llvm-lit >/dev/null; then
            llvm-lit -sv llvm-training/tests
          elif command -v lit >/dev/null; then
            lit -sv llvm-training/tests
          else
            echo "llvm-lit/lit not present; skipping llvm-training lit tests"
          fi

      - name: LLVM training MLIR examples
        run: bash llvm-training/tools/verify-mlir-examples.sh

      - name: LLVM training BCIR mapping fixtures
        run: bash llvm-training/tools/verify-bcir-mapping.sh

      - name: LLVM training llc smoke
        run: |
          if command -v llc >/dev/null; then
            bash llvm-training/tools/smoke-llc.sh
          else
            echo "llc not present; skipping llvm-training llc smoke validation"
          fi

      - name: Optional BOLT smoke fixture
        run: bash llvm-training/tools/smoke-bolt.sh

  mlir-rail-validate:
    name: BCIR MLIR rail (tblgen + IRDL + bcir-opt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MLIR 18 toolchain + dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y mlir-18-tools libmlir-18-dev llvm-18-dev \
            llvm-18-tools cmake ninja-build

      - name: Validate ODS dialect family (mlir-tblgen)
        run: bash tools/wsl/tblgen_check.sh

      - name: Validate IRDL projection round-trip (stock mlir-opt)
        run: bash tools/irdl/check_corpus.sh

      - name: Build the compiled bcir-opt (LangRef M3)
        run: bash tools/wsl/build_mlir.sh

      - name: Validate pretty ODS examples (bcir-opt + FileCheck)
        run: bash tools/wsl/check_ods_examples.sh

      - name: Validate Phase-6 passes (verify / promote / lower)
        run: bash tools/wsl/check_passes.sh
