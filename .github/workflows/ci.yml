name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Every job is validation-only.  Keep the repository token read-only even if a
# future repository default grants broader permissions.
permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid pushes no longer queue 9-min rail jobs
# behind each other).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The former monolithic "oracle + training" job is split into three jobs that run in
  # PARALLEL (oracle | c-runtime | llvm-training) — the check-runtime / decoder-fuzz / training
  # work no longer sits sequentially behind the ~80s Python suite, so the critical path drops
  # from their sum to their max. Each job restores the same cached toolchain (clang/lld/llvm/node).
  oracle:
    name: BCIR oracle ${{ matrix.shard }}/2 (Python conformance + parity + fuzz)
    runs-on: ubuntu-latest
    # The suite is sharded across two runners. A shard is a STRIDE of the discovery order,
    # not a contiguous block: `test_c_cfront` is ~60% of the suite's CPU and its tests are
    # adjacent, so contiguous halves would leave one shard doing nearly all the work.
    # The union of the shards is exactly the full inventory and they are disjoint, so this
    # cannot drop a test -- the property that makes splitting a conformance suite safe.
    # Sharding only pays across SEPARATE runners. On ONE 4-core machine it is a net LOSS,
    # because each shard already saturates the cores and the pool startup is paid twice
    # (measured locally, thorough -j0: 140s unsharded vs 70s + 89s = 159s run one after the
    # other). Across two runners the job's wall time is the SLOWER shard, so the 44/56 split
    # above is what matters, not the sum.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        # cache-apt-pkgs-action always runs `apt-get update` ("Updating APT package list..."), which
        # can hang indefinitely on a congested/timing-out apt mirror. Bound it: 3 retries, a 20s
        # per-source timeout (a slow mirror fails fast and retries instead of hanging), no
        # translation indexes, and drop the ESM/Pro sources (our packages are all in main).
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install lowering toolchain (clang/lld/llvm for AOT/JIT/WASM tests; node for WASM; mono for CIL)
        # Caches the INSTALLED file tree (not just the .debs), so a warm run restores it in seconds
        # and skips apt's dpkg unpack/configure entirely -- the remaining install-time floor. Pinned
        # to v1.6.1 by commit SHA (supply-chain). Bump `version` to invalidate the cache.
        # mono-devel supplies ilasm + the mono runtime so the stackify CIL emit is ASSEMBLED AND
        # EXECUTED on a real CLR (test_stackify_exec.py), closing the H5 "documented skip".
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm nodejs libclang-rt-18-dev mono-devel
          version: train-${{ runner.arch }}-v2

      - name: BCIR oracle (Python conformance tests)
        # -j0 = every core. run_all's own default is a deliberately safe min(cpu, 2) for a
        # developer workstation (AGENTS.md caps local work at two workers); a dedicated CI
        # runner has no such constraint and the suite is ~2x oversubscribed against it.
        # Measured on the thorough tier: 343s of test CPU over 4 cores, so the wall time is
        # bound by the pool width, not by any single test (the longest is ~15s).
        run: BCIR_THOROUGH=1 python3 -m bcir.tests.run_all -j0 --shard ${{ matrix.shard }}/2

      # The campaigns below are whole-suite work, not per-test, so they run ONCE on shard 1
      # rather than being duplicated. Guarding them also keeps the artifact names unique.
      - name: Bounded TMSAO cross-organ audit (correctness strict; timings informational)
        if: matrix.shard == 1
        run: python3 tools/perf/run_tmsao_audit.py --repeats 3 --output build/performance/tmsao-report.json

      - name: Upload bounded TMSAO report
        if: matrix.shard == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bcir-tmsao-performance-report
          path: build/performance/tmsao-report.json
          if-no-files-found: error

      - name: BCIR generated Python<->MLIR differential parity (large campaign)
        if: matrix.shard == 1
        run: |
          # the two seeds are independent campaigns -> run them in parallel; wait on
          # each PID so a failure in either still fails the step (bare `wait` would not).
          python3 -m bcir.kbcir.differential -n 8000 --seed 1 & p1=$!
          python3 -m bcir.kbcir.differential -n 8000 --seed 2 & p2=$!
          wait "$p1"; wait "$p2"
          # the committed corpus IR must equal a fresh emission (drift gate)
          python3 -m bcir.kbcir.differential --emit-corpus
          git diff --exit-code -- mlir/test/passes/gem_corpus.mlir
          # the six-target capability matrix must equal a fresh emission too (drift gate)
          python3 -m bcir.kbcir.differential --emit-matrix
          git diff --exit-code -- mlir/test/passes/target_matrix.mlir

      - name: BCIR trust-boundary fuzz (seeded by gen_module)
        if: matrix.shard == 1
        run: |
          python3 -m bcir.kbcir.fuzz -n 4000 --seed 1 & pf1=$!
          python3 -m bcir.kbcir.fuzz -n 4000 --seed 2 & pf2=$!
          wait "$pf1"; wait "$pf2"

  c-runtime:
    name: BCIR C runtime (StreamPack byte-identity + decoder fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install lowering toolchain (clang/lld/llvm; node for WASM)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm nodejs libclang-rt-18-dev
          version: train-${{ runner.arch }}-v1

      - name: Freestanding C StreamPack runtime (no-libc + Python->C ABI parity)
        # BCIR_SKIP_CFRONT_SANITIZE=1: this script ALSO invokes tools/c/sanitize_cfront.sh, which
        # the dedicated step below runs. Without the opt-out the 300-valid/400-malformed ASan/UBSan
        # campaign ran twice in this job -- and the nested call additionally ran the ~20x Valgrind
        # stage the dedicated step deliberately drops. Valgrind coverage lives in
        # .github/workflows/c-memory-deep-sweep.yml (SANITIZE_VG_SUBSET=30), not on the PR path.
        run: BCIR_SKIP_CFRONT_SANITIZE=1 bash tools/c/check_runtime.sh

      - name: Cache the immutable TinyLlama source checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bcir/models/tinyllama-v0/298338802ab94432b917bcce11382aa151aee50f
          key: bcir-tinyllama-v0-298338802ab94432b917bcce11382aa151aee50f-c302246d91e2854f-ab1b681ec7fc02fe

      - name: Pinned real-model BCIRQ8 -> standalone C parity gate
        timeout-minutes: 20
        run: python3 tools/models/run_real_model_gate.py --output-dir build/model-gate

      - name: Upload deterministic real-model parity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bcir-real-model-parity-report
          path: build/model-gate/parity-report.json
          if-no-files-found: error

      - name: Allocator-failure and direct-channel sanitizer sweep
        run: MEMORY_DISCIPLINE_SANITIZE=1 bash tools/c/check_memory_discipline.sh

      - name: CT4 measured-replan runbook (degrade mode; the rig path stays exercised)
        # No PMU/RAPL/governor in CI, so this degrades honestly (synthetic, no measured win)
        # and exits 0 -- it gates that the rig path never silently rots. On a bare-metal rig
        # `--require-real` produces the measured win (docs/kernel/HARDWARE_VALIDATION.md).
        run: bash tools/silicon/measure_replan.sh

      - name: Perf-budget gate (correctness + measurement validity; perf floors bare-metal-only)
        # Non-flaky by design: STRICT on correctness + measurement validity always, perf floors
        # only under BCIR_BAREMETAL (unset here), so a loaded shared runner never flakes the gate.
        run: python3 tools/perf/check_budgets.py --trend build/perf/trend.jsonl

  # The C rail's ADVERSARIAL half, split out of c-runtime so it runs on its own runner rather
  # than queueing behind the byte-identity gates. Same reasoning (and same measurement) as the
  # earlier oracle | c-runtime | llvm-training split above: c-runtime was a ~9-minute serial
  # chain on a 4-core machine, and its sanitizer/static-analysis/fuzz half is independent of
  # its parity/model half -- neither reads the other's outputs. The two halves are balanced to
  # ~3 minutes each, so the C critical path is now their max instead of their sum.
  c-analysis:
    name: BCIR C analysis (sanitizers + static analysis + decoder fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install lowering toolchain (clang + compiler-rt for ASan/UBSan/libFuzzer)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm nodejs libclang-rt-18-dev
          version: train-${{ runner.arch }}-v1

      - name: cfront twin sanitizer sweep (ASan/UBSan/LSan over the C compiler's own lexer/parser/lowering/emit)
        # SANITIZE_ENGINES_PARALLEL=1 runs the clang and gcc ASan/UBSan campaigns at the same
        # time. They build separate binaries from the same sources and share nothing but the
        # fixture files, which are read-only -- so the only thing serializing them was the
        # order they were written in.
        # Runs tools/c/sanitize_cfront.sh -- the ASan+UBSan+LSan harness over the bcir_cfront C twin
        # (every cfront_*.c fixture + a bounded 300-valid/400-malformed fuzz campaign + the adversarial
        # Bug-1/2/A/B fixtures), so a memory bug INSIDE the compiler -- including the SEG6/7 fence + the
        # c.asm lowering -- is caught, not just rail-output divergence. The runner has clang+libclang-rt
        # and gcc, so both ASan engines + clang's stricter UBSan-trap run; the script self-skips a missing
        # engine and fails LOUD only if NONE ran. Valgrind (the slow ~20x stage) is dropped here so the
        # step stays well under a minute; ASan/UBSan/leak remain always-on. check_runtime.sh's own nested
        # call to this same harness is suppressed in the c-runtime job (BCIR_SKIP_CFRONT_SANITIZE=1) so
        # the campaign runs exactly once per CI run; the Valgrind stage lives in c-memory-deep-sweep.yml.
        run: SANITIZE_SKIP_VALGRIND=1 SANITIZE_ENGINES_PARALLEL=1 bash tools/c/sanitize_cfront.sh

      - name: Hosted C ownership static analysis
        # Ten independent whole-file analyses (clang --analyze is single-threaded per TU and
        # bcir_cfront.c alone dominates), so they fan out across the runner's cores instead of
        # queueing. Each still fails the gate on a nonzero exit OR on any diagnostic at all --
        # `--analyze` reports findings on stderr while exiting 0, so the emptiness check is the
        # part that actually enforces "no ownership diagnostics".
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          sources="bcir_cpp.c bcir_cfront.c bcir_artifact_bundle.c bcir_q8_model.c bcir_q4_kernel.c bcir_ai_kernels.c bcir_ai_microbench.c bcir_llama.c bcir_runtime_channel.c bcir_verify.c"
          for source in ${sources}; do
            (
              if clang --analyze -std=c11 -I runtime/c "runtime/c/${source}" -o /dev/null \
                   2>"${workdir}/${source}.log"; then
                [ -s "${workdir}/${source}.log" ] && echo failed > "${workdir}/${source}.rc"
              else
                echo failed > "${workdir}/${source}.rc"
              fi
            ) &
          done
          wait
          status=0
          for source in ${sources}; do
            if [ -f "${workdir}/${source}.rc" ]; then
              echo "::error::clang --analyze reported diagnostics in runtime/c/${source}" >&2
              cat "${workdir}/${source}.log" >&2
              status=1
            fi
          done
          exit "${status}"

      - name: Binary trust-boundary fuzz (libFuzzer + ASan/UBSan on all ten decoders)
        # StreamPack decoder/executor/encoder, the ETL binary-record decoder, the UART
        # telemetry-frame decoder, the BCIRQ8 model loader, the BCAB artifact-bundle
        # reader, the X.690 BER/DER decoder, and the DER -> native StreamPack fast path --
        # every runtime/c/ entry point that parses bytes it did not produce. The campaigns are
        # independent processes and run concurrently (FUZZ_JOBS, default nproc); the per-harness
        # run count and time bound are unchanged, so only the scheduling differs.
        run: FUZZ_RUNS=500000 bash tools/c/fuzz_streampack.sh

  host-portability:
    name: Host portability (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Quick tier (portable process pool; spawn on Windows)
        # -j0 = every core. The point of this step is the PORTABLE POOL (spawn on Windows), so
        # widening it also widens what is being tested, not just how fast it finishes.
        run: python -m bcir.tests.run_all --tier quick -j0

      - name: Focused host adaptation checks
        run: python -c "from bcir.tests import test_silicon as s, test_tiers as t, test_toolchain as h; s.test_counter_sampler_degrades_without_posix_rusage(); t.test_versioned_and_windows_tool_names_are_gated_by_family(); t.test_pool_context_uses_spawn_when_fork_is_unavailable(); [getattr(h, n)() for n in sorted(dir(h)) if n.startswith('test_')]"

      - name: C memory classes, strict warnings, allocator failures, and direct channel
        shell: bash
        run: CC=clang bash tools/c/check_memory_discipline.sh

      - name: Native AI C/Python parity and bounded measurement
        run: python -m bcir.tests.test_native_ai

      - name: Clang statement-expression/bitfield differential
        run: |
          clang --version
          python -c "from bcir.tests.test_c_cfront import test_stmtexpr_dual_rail; test_stmtexpr_dual_rail()"

      - name: Install Ninja (pinned wheel; makes the generator choice deterministic)
        # The generator dominates the gate below, so which one is available must not be left to
        # whatever the runner image happens to ship. The pip wheel is ~300 KB and installs in a
        # couple of seconds. Version-pinned like the other pip installs in this workflow.
        # `|| true`: a failed install is not a test failure -- the gate below just falls back to
        # the serial default generator, which is exactly the behaviour before this step existed.
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input ninja==1.13.0 || true

      - name: LLVM training aggregate CMake gate
        shell: bash
        # 16 independent gates, each a short bash/python process. THE GENERATOR DOMINATES, and
        # getting it wrong is measurable: with the Visual Studio generator CMake gives every custom
        # target its own .vcxproj and `-j` becomes MSBuild `/m`, which spawns a build node per
        # project. Measured on windows-latest: 124s serial, **290s** with `-j 4` under MSBuild --
        # the parallel flag more than doubled the time. Ninja has no per-target project overhead,
        # so it is preferred and the SERIAL default generator is the fallback, never a parallel
        # MSBuild.
        #
        # The probe is an actual `-G Ninja` configure rather than `command -v ninja`, because the
        # question that matters is whether CMAKE can use Ninja, not whether a binary sits on PATH.
        # The fallback MUST wipe the build directory: a failed configure can still leave a
        # CMakeCache.txt pinning CMAKE_GENERATOR:INTERNAL=Ninja, and re-configuring that directory
        # without -G does not reset it -- CMake silently RETAINS the cached generator (verified),
        # so the fallback would quietly rebuild with the very generator that just failed. Passing
        # an explicit conflicting -G instead hard-errors ("Does not match the generator used
        # previously"). Removing the directory is the only clean recovery.
        #
        # LLVM_TRAINING_USES_TERMINAL=OFF is what lets Ninja actually parallelize: USES_TERMINAL
        # puts a target in the console pool, which has depth 1. It is a no-op for the VS generator,
        # which is why turning it off alone did nothing on Windows. The CMake default stays ON for
        # a developer who wants live streaming output.
        run: |
          if cmake -S llvm-training -B build/llvm-training -G Ninja -DLLVM_TRAINING_USES_TERMINAL=OFF; then
            echo "generator: Ninja (parallel, -j 4)"
            cmake --build build/llvm-training --target llvm-training-check -j 4
          else
            echo "generator: default, SERIAL (CMake could not configure with Ninja)"
            rm -rf build/llvm-training
            cmake -S llvm-training -B build/llvm-training
            cmake --build build/llvm-training --target llvm-training-check
          fi

      - name: Tests leave tracked sources unchanged
        run: git diff --exit-code

  hosted-model:
    name: Hosted model train-to-C (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned hosted-model CPU environment
        run: |
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install --disable-pip-version-check --no-input "safetensors[numpy]==0.8.0" numpy==2.2.6

      - name: Hosted model configuration, checkpoint, resume, export, and train-to-C gate
        run: python tools/models/test_hosted_model_lab.py --output-dir build/hosted-model-gate

      - name: Offline pretrain, alignment, reasoning, embedding, and small-model gate
        run: python tools/models/test_training_pipeline.py --output-dir build/training-pipeline-gate

      - name: Adaptive transformer architecture and tiny-training gate
        run: python tools/models/test_adaptive_transformers.py --output-dir build/adaptive-transformer-gate

      - name: Byte-native BLT, MambaByte, and tiny-training gate
        run: python tools/models/test_byte_latent_models.py --output-dir build/byte-native-model-gate

      - name: Sequence-interface, tokenizer-adaptation, and progressive-growth gate
        run: python tools/models/test_sequence_interfaces.py --output-dir build/sequence-interface-gate

      - name: Bounded hardware RL train, search, static-memory, and StreamPack gate
        run: python tools/models/run_hardware_rl_gate.py --output-dir build/hardware-rl-gate

      - name: Upload deterministic hosted-model parity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bcir-hosted-model-parity-report-${{ runner.os }}
          path: |
            build/hosted-model-gate/parity-report.json
            build/training-pipeline-gate/report.json
            build/adaptive-transformer-gate/report.json
            build/byte-native-model-gate/report.json
            build/sequence-interface-gate/report.json
            build/hardware-rl-gate/report.json
          if-no-files-found: error

      - name: Tests leave tracked sources unchanged
        run: git diff --exit-code

  llvm-training:
    name: LLVM training corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install LLVM toolchain (llvm-as/opt/llc/clang for the corpus checks)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm nodejs libclang-rt-18-dev
          version: train-${{ runner.arch }}-v1

      - name: LLVM training examples and invalid-example tripwire
        run: |
          if command -v llvm-as >/dev/null && command -v opt >/dev/null; then
            bash llvm-training/tools/verify-examples.sh
          else
            echo "llvm-as and opt not both present; skipping llvm-training standalone example validation"
          fi

      - name: LLVM training example and artifact manifest drift
        run: bash llvm-training/tools/verify-manifest.sh

      - name: LLVM training exercise solutions and prompt templates
        run: llvm-training/tools/run-if-tools.sh "LLVM exercise verifier" llvm-as opt -- bash llvm-training/tools/verify-exercises.sh

      - name: LLVM training declarative exercise manifests
        run: python3 llvm-training/tools/verify-exercise-manifests.py

      - name: LLVM training autograder self-tests
        run: |
          python3 -m unittest discover -s llvm-training/autograder/tests -p 'test_*.py'
          python3 llvm-training/tools/grade-exercises.py --self-test --format json --output build/llvm-training-reference-scores.json

      - name: LLVM training deterministic dataset export
        run: python3 llvm-training/tools/verify-dataset-export.py

      - name: LLVM training controlled variant determinism
        run: python3 -m unittest llvm-training/autograder/tests/test_generate_exercise_variants.py

      - name: LLVM training adversarial fixtures
        run: llvm-training/tools/run-if-tools.sh "LLVM adversarial verifier" llvm-as opt -- bash llvm-training/tools/verify-adversarial-fixtures.sh

      - name: LLVM training binary-analysis CSV schemas
        run: llvm-training/tools/verify-csv-schema.sh

      - name: LLVM training binary-analysis evidence manifest
        run: python3 llvm-training/tools/verify-binary-analysis-evidence.py

      - name: LLVM training deterministic binary-analysis evidence drift
        run: python3 llvm-training/tools/generate-binary-analysis-fixtures.py --check --require-tools

      - name: LLVM training invalid fixtures
        run: |
          if command -v llvm-as >/dev/null && command -v opt >/dev/null; then
            bash llvm-training/tools/verify-invalid-fixtures.sh
          else
            echo "llvm-as and opt not both present; skipping llvm-training invalid fixture validation"
          fi

      - name: LLVM training opt-diff golden fixtures
        run: |
          if command -v opt >/dev/null; then
            bash llvm-training/tools/verify-opt-diff.sh
          else
            echo "opt not present; skipping llvm-training opt-diff golden validation"
          fi

      - name: LLVM training opaque pointer syntax
        run: bash llvm-training/tools/verify-opaque-pointers.sh

      - name: Configure training-only CMake quality targets
        run: cmake -S llvm-training -B build/llvm-training -G Ninja

      - name: LLVM training lit tests
        run: |
          if command -v llvm-lit >/dev/null; then
            llvm-lit -sv llvm-training/tests
          elif command -v lit >/dev/null; then
            lit -sv llvm-training/tests
          else
            echo "llvm-lit/lit not present; skipping llvm-training lit tests"
          fi

      - name: LLVM training MLIR examples (reduced coverage allowed)
        run: bash llvm-training/tools/verify-mlir-examples.sh

      - name: LLVM training BCIR mapping fixtures
        run: bash llvm-training/tools/verify-bcir-mapping.sh

      - name: LLVM training llc smoke
        run: |
          if command -v llc >/dev/null; then
            bash llvm-training/tools/smoke-llc.sh
          else
            echo "llc not present; skipping llvm-training llc smoke validation"
          fi

      - name: LLVM training deterministic LTO matrix
        run: |
          for lto in none thin full; do
            bash llvm-training/tools/run-lto-matrix.sh \
              --lto "$lto" \
              --output "build/lto-matrix-$lto" \
              --require-supported
            python3 -m json.tool "build/lto-matrix-$lto/report.json" >/dev/null
          done

      - name: Optional BOLT smoke fixture
        run: bash llvm-training/tools/smoke-bolt.sh

  # Native aarch64 (ARM) coverage: the first real driver target is a Raspberry Pi 5, so the
  # portable core must be proven on ARM, not only x86. Catches arch regressions the x86 jobs
  # cannot -- the perf_event_open syscall number (241 on aarch64, not x86's 298), the tile
  # lane width (vec4 on NEON, not 16), host-arch target defaults, and the freestanding C
  # runtime (endianness / fixed-width / no-libc) -- on GitHub's native ARM runners.
  #
  # Split into oracle-arm64 | c-runtime-arm64 that run in PARALLEL, mirroring the x86 oracle /
  # c-runtime split: the ~25s ARM StreamPack runtime no longer sits sequentially behind the
  # Python conformance suite, so the ARM critical path drops from their sum to their max. Each
  # restores the same cached toolchain and re-confirms it is really running on aarch64.
  oracle-arm64:
    name: BCIR oracle (aarch64 / ARM)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install the C lowering toolchain
        # Caches the installed file tree (restores in seconds; skips dpkg unpack on a warm run).
        # Pinned to v1.6.1 by commit SHA; bump `version` to invalidate.
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm
          version: arm-${{ runner.arch }}-v1

      - name: Confirm the runner is aarch64
        run: |
          test "$(uname -m)" = "aarch64" || { echo "expected aarch64, got $(uname -m)"; exit 1; }
          python3 -c "from bcir.kbcir.cost import default_target_name, TargetProfile; \
            print('host default:', default_target_name(), TargetProfile.for_host().name)"

      - name: BCIR oracle (Python conformance) on ARM
        run: BCIR_THOROUGH=1 python3 -m bcir.tests.run_all -j0

      - name: Python<->MLIR differential parity on ARM (smaller campaign)
        run: python3 -m bcir.kbcir.differential -n 3000 --seed 1

  c-runtime-arm64:
    name: BCIR C runtime (aarch64 / ARM)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources) — stops update hangs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install the C lowering toolchain
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm
          version: arm-${{ runner.arch }}-v1

      - name: Confirm the runner is aarch64
        run: test "$(uname -m)" = "aarch64" || { echo "expected aarch64, got $(uname -m)"; exit 1; }

      - name: Freestanding C StreamPack runtime on ARM (no-libc + ABI parity)
        run: bash tools/c/check_runtime.sh

      - name: Native AI strict C and ownership gates on ARM
        run: CC=clang bash tools/c/check_memory_discipline.sh

      - name: CT4 measured-replan runbook on ARM (degrade mode; exercises the perf syscall)
        run: bash tools/silicon/measure_replan.sh

  mlir-rail-validate:
    name: BCIR MLIR rail (LLVM ${{ matrix.llvm }})
    runs-on: ubuntu-latest
    # The gating MLIR rail tracks the LATEST LLVM/MLIR release (23; 22 stays in the matrix
    # for one release cycle, as the 21->22 move did in PRs #243-#246). Ubuntu's default
    # repos on ubuntu-latest top out near LLVM 18/19, so the toolchain comes from
    # apt.llvm.org (the llvm.sh helper adds the signed repo). The scripts auto-resolve
    # the toolchain version-agnostically (build_mlir.sh picks the highest installed
    # /usr/lib/llvm-*; FileCheck / mlir-opt / mlir-tblgen resolve the same way; the
    # training grader grades against the LLVM_SUFFIX major), so bumping the major is a
    # one-line matrix change. The Symbol-container ops (registry / kbcir.plan /
    # gem.stream_pack / parse.grammar / fsm.machine / binary.format) carry the
    # SymbolTable trait, satisfying the "symbol's parent must be a SymbolTable"
    # verifier that has only tightened since LLVM 19.
    strategy:
      fail-fast: false
      matrix:
        llvm: ["22", "23"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Add the apt.llvm.org signed repo + harden apt (LLVM ${{ matrix.llvm }})
        # The latest LLVM/MLIR is not in Ubuntu's default repos; apt.llvm.org carries it (the repo
        # llvm.sh would add). Harden apt against mirror hangs FIRST (retries + a 20s per-source
        # timeout + no translation indexes; drop the slow ESM/Pro sources AND the pre-installed
        # Microsoft/azure runner repos, which began returning 403 "no longer signed" and hard-fail
        # `apt-get update` (exit 100) -- BCIR needs neither), then `apt-get update`
        # so the install action -- whose package-name resolution runs against the CURRENT lists,
        # before any update of its own -- can find the llvm-${{ matrix.llvm }}/mlir packages.
        run: |
          . /etc/os-release                                       # VERSION_CODENAME (e.g. noble)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
          sudo apt-get update   # the install action resolves names against existing lists -- needed

      - name: Install MLIR ${{ matrix.llvm }} toolchain + dev libs (cached installed-tree)
        # Install ONLY what the rail needs -- the MLIR/LLVM dev libs + tools (mlir-opt / mlir-tblgen
        # / FileCheck) + cmake/ninja/ccache. bcir-opt builds with the runner's pre-installed g++
        # (CMake default; no script uses clang/lld/lldb/clangd), so llvm.sh's heavy clang+lldb+clangd
        # base is skipped. The action caches the installed file tree -> a warm run restores it in
        # seconds and skips dpkg unpack/configure. Pinned to v1.6.1 by commit SHA.
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: llvm-${{ matrix.llvm }}-dev llvm-${{ matrix.llvm }}-tools libmlir-${{ matrix.llvm }}-dev mlir-${{ matrix.llvm }}-tools cmake ninja-build ccache
          version: mlir${{ matrix.llvm }}-v1

      - name: Cache ccache (warms the bcir-opt compile against the MLIR headers)
        # The bcir-opt compile dominates this job's wall time; ccache turns a warm run
        # into a near-instant relink. Keyed per-LLVM-major, newest-first restore.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-mlir${{ matrix.llvm }}-${{ github.sha }}
          restore-keys: |
            ccache-mlir${{ matrix.llvm }}-

      - name: Validate ODS dialect family (mlir-tblgen)
        run: bash tools/wsl/tblgen_check.sh

      - name: Validate IRDL projection round-trip (stock mlir-opt)
        run: bash tools/irdl/check_corpus.sh

      - name: Build the compiled bcir-opt (LangRef M3)
        run: bash tools/wsl/build_mlir.sh

      - name: Validate pretty ODS examples (bcir-opt + FileCheck)
        run: bash tools/wsl/check_ods_examples.sh

      - name: Validate Phase-6 passes (verify / promote / lower)
        run: bash tools/wsl/check_passes.sh

      - name: Malformed-input differential with the compiled rail required
        # This job just built bcir-opt (build/mlir-build/bin), so here the
        # compiled/python law comparison must actually run - an absent binary
        # fails the step instead of skipping every compiled case.
        run: python3 tools/security/run_malformed_differential.py --require-compiled

      - name: Validate MLIR bytecode round-trip (Properties survive text<->bytecode)
        run: bash tools/wsl/check_bytecode.sh

      - name: Grade training MLIR conversion and LLVM translation tiers (required tools)
        env:
          LLVM_SUFFIX: "-${{ matrix.llvm }}"
        run: |
          bash llvm-training/tools/verify-mlir-examples.sh --require-tools
          python3 llvm-training/tools/grade-exercises.py --self-test --format json --output build/mlir-rail-training-scores.json

  docs-governance:
    name: Docs governance (status drift + links + retired paths)
    runs-on: ubuntu-latest
    # Pure-Python, no toolchain: keeps prose honest against the code. Three gates —
    #   1. docs/STATUS.md must equal a fresh generation (no hand-typed count drift),
    #   2. no broken relative Markdown links (code-aware: C++/IR snippets aren't links),
    #   3. no *active* doc points at a retired tree (e.g. removed runtime/llvm/) without the
    #      explicit `<!-- allow-retired-paths -->` historical marker.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: STATUS.md is generated from the tree (no count/law drift)
        run: python3 tools/docs/gen_status.py --check

      - name: No broken relative Markdown links
        run: python3 tools/docs/check_links.py

      - name: No active-doc references to retired trees (allowlist via marker)
        run: python3 tools/docs/check_retired_paths.py

      - name: Summary claims still match the code they summarise
        run: python3 tools/docs/check_claims.py
      - name: Verifier-law ranges in prose match the tree (no former-last-law drift)
        run: python3 tools/docs/check_law_range.py

      - name: Hot/cold import quarantine (research organs stay off the simple path)
        run: python3 tools/perf/import_graph.py --check

  python-floor:
    name: Declared Python floor (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The MINIMUM this package advertises. Every other Python job runs a
        # newer interpreter, so without this cell `requires-python = ">=3.11"`
        # was a claim nothing exercised: syntax or stdlib behaviour available
        # only on the runner's newer interpreter could ship broken for users
        # sitting exactly on the declared floor.
        python: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: The interpreter IS the declared floor (anti-vacuity)
        # A cell that silently ran 3.13 would pass while testing nothing it
        # exists to test, so the running interpreter is checked against the
        # floor READ FROM pyproject.toml rather than a copy of it here:
        # raising the floor without updating this job fails the job.
        run: |
          python - <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as handle:
              declared = tomllib.load(handle)["project"]["requires-python"]
          floor = tuple(int(part) for part in declared.lstrip(">=~^ ").split(".")[:2])
          running = sys.version_info[:2]
          print(f"declared floor {declared!r} -> {floor}; running {running}")
          if running != floor:
              raise SystemExit(
                  f"this job must run the declared floor {floor}, not {running}"
              )
          PY

      - name: Quick tier on the floor interpreter
        run: python -m bcir.tests.run_all --tier quick -j0

      - name: Required security gates on the floor interpreter
        run: |
          python tools/security/audit_dependencies.py
          python tools/security/scan_secrets.py
          python tools/security/audit_tool_boundaries.py

      - name: The package builds and imports on the floor interpreter
        # Packaging is part of the claim: a wheel that cannot be built or
        # imported on the advertised minimum is the same defect as code that
        # cannot run there.
        run: |
          python -m pip install --disable-pip-version-check --no-input build==1.2.2.post1
          python -m build --wheel --outdir dist/
          python -m pip install --disable-pip-version-check --no-input dist/*.whl
          cd "$RUNNER_TEMP" && python -c "import bcir; print('imported', bcir.__name__)"

  security-assurance:
    name: Security assurance (secrets, inventory, campaigns, review contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Harden apt (timeouts + retries; drop slow ESM/Pro sources)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-pro* /etc/apt/sources.list.d/*esm* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null

      - name: Install clang + compiler-rt for the bounded decoder campaign
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f
        with:
          packages: clang lld llvm libclang-rt-18-dev
          version: security-assurance-${{ runner.arch }}-v1

      - name: Secret scan with explicit binary/archive policy
        run: python3 tools/security/scan_secrets.py

      - name: Python for the advisory engine
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the advisory engine (pinned)
        # pip-audit is the one rail in this job that consults the network: pip's
        # resolver over the asserted install set, then PyPI's advisory database.
        # It is pinned, and the audit below REQUIRES it: this job installs the
        # engine, so this job owns its absence (L10). Every other job that runs
        # the audit asserts the inventory only and records a missing engine as
        # skipped -- a skip is honest only where absence is expected.
        run: python -m pip install --disable-pip-version-check --no-input pip-audit==2.10.1

      - name: Inventory-first dependency audit (advisory rail required)
        run: python3 tools/security/audit_dependencies.py --require-advisory

      - name: Lowering and developer-tool boundary policy
        run: python3 tools/security/audit_tool_boundaries.py

      - name: Bounded StreamPack/BCAB/model decoder campaign
        run: python3 tools/security/run_decoder_campaign.py --mutations 24 --fuzz-runs 200 --fuzz-seconds 8 --require-c

      - name: Malformed-input Python/MLIR differential
        run: python3 tools/security/run_malformed_differential.py

      - name: Fail-closed independent-review contract
        run: python3 tools/security/independent_review.py --self-check
