name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Gate verifier correctness
        run: ctest --test-dir build --output-on-failure -R bcir-parser-verifier-unit

      - name: Gate runtime regression checks
        run: ctest --test-dir build --output-on-failure -R bcir-runtime-regression

      - name: Full test suite
        run: ctest --test-dir build --output-on-failure

      - name: LLVM training standalone examples verify
        run: |
          if command -v llvm-as >/dev/null && command -v opt >/dev/null; then
            bash llvm-training/tools/verify-examples.sh
          else
            echo "llvm-as and opt not both present; skipping llvm-training standalone example validation"
          fi

      - name: LLVM seed validate
        run: |
          if command -v llvm-as >/dev/null && command -v llvm-link >/dev/null && command -v opt >/dev/null && command -v llvm-dis >/dev/null; then
            bash runtime/llvm/validate_llvm_seed.sh
            bash runtime/llvm/validate_phase2.sh
            bash runtime/llvm/validate_phase3.sh
            bash runtime/llvm/validate_phase4.sh
          else
            echo "LLVM toolchain not present; skipping runtime/llvm validation scripts"
          fi
