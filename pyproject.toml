# Packaging + tooling for the BCIR oracle (the pure-Python `bcir/` rail). The MLIR/C++ law
# (`mlir/`) and the freestanding C runtime (`runtime/c/`) build separately via CMake
# (see mlir/CMakePresets.json) — this file governs the Python package only.
[build-system]
# Security floor: 83.0.0 fixes GHSA-h35f-9h28-mq5c; it also retains fixes for
# GHSA-5rjg-fvgr-3xxf and GHSA-cx63-2mw6-8hw5.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bcir"
version = "0.2.0"
description = "Binary Correspondence Intermediate Representation — the executable conformance oracle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-BCIR-NC-1.0" }  # BCIR Non-Commercial License v1.0 — see LICENSE
keywords = ["compiler", "mlir", "intermediate-representation", "optimization", "bcir"]
# The oracle is deterministic and dependency-free by design (pure-Python, integer/Q-fixed
# hot-path math). Keep `dependencies` empty — a third-party dep on the oracle rail is a
# regression. Heavy research organs stay import-quarantined (tools/perf/import_graph.py).
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pre-commit>=3.5"]
model-lab = ["torch==2.13.0", "safetensors[numpy]==0.8.0", "numpy==2.2.6"]

[project.scripts]
bcir = "bcir.run:main"
bcir-pack = "bcir.abi.streampack_tool:main"
bcir-bundle = "bcir.abi.artifact_tool:main"
bcir-registry = "bcir.registry_tool:main"
bcir-model-assess = "bcir.frontends.models.assess_tool:main"
bcir-asn1c = "bcir.frontends.asn1.__main__:main"
bcir-ham-plan = "bcir.kbcir.ham_tool:main"
bcir-tmsao-audit = "bcir.performance_audit:main"

[project.urls]
Homepage = "https://github.com/Mecca-Research/Binary-Correspondence-Intermediate-Representation"
Documentation = "https://github.com/Mecca-Research/Binary-Correspondence-Intermediate-Representation/blob/main/docs/BCIR_LANGREF.md"

[tool.setuptools.packages.find]
include = ["bcir*"]

# The ASN.1 modules are SOURCE, not documentation: `bcir/asn1/BCIR-StreamPack.asn1` is
# what the X.680 front-end compiles into the projection's type model, and the RFC 5280
# excerpt is what the third-party conformance test reads. An sdist/wheel without them
# installs a package whose own tests cannot run. `*.ecn` is the same for X.692's encoding
# definition modules: `BCIR-FrameHeader.ecn` is the specification the ECN gate encodes.
[tool.setuptools.package-data]
"bcir.asn1" = ["*.asn1", "*.ecn"]
"bcir.frontends.asn1" = ["testdata/*.asn1"]
# The calibrated microbenchmark tables are LIBRARY data, not fixtures:
# tile_prior, bayescal and microbench read `tables/*.json` to apply a
# measured profile to a TargetProfile, so an installed wheel without them
# raises "cannot read calibrated profile" from close_loop() itself — not
# only from a test. A package must contain what it registers (L21).
"bcir.kbcir" = ["tables/*.json"]

# --- ruff ---------------------------------------------------------------------------
# Calibrated to be GREEN on the existing tree so the gate catches *regressions*, not the
# codebase's deliberate house style (compact one-liners, long descriptive strings, the
# PEP 562 lazy-import shims). Tighten incrementally.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "llvm-training/dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # long lines — many are intentional one-line tables / descriptive strings
    "E701", "E702", "E703",  # compact `if x: y` / `a; b` house style
    "E731",   # assigned lambdas (used as small local kernels)
    "E741",   # ambiguous names (l/I/O appear in math-y code)
    "E401", "E402",  # grouped / deferred imports (lazy-import shims, sys.path bootstraps)
    "F401", "F841",  # re-export shims + scaffolding locals; not worth churning
    "B007", "B008", "B011", "B027", "B905",  # deliberate defaults / asserts / zip usage
    "UP007", "UP015", "UP031", "UP035", "UP037", "UP045",  # annotation-style noise
]

[tool.ruff.format]
quote-style = "double"
